<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>렉시오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&family=Song+Myung&display=swap" rel="stylesheet">
<!-- Firebase (온라인 대전용). 설정값이 비어 있으면 '혼자 연습'만 동작합니다. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    /* 마작 테이블 색 */
    --felt:#0e5a4b; --felt-deep:#0a4339; --felt-light:#16705e;
    --wood:#6b3f1f; --wood-light:#9a6235; --wood-dark:#3e2210;
    --ivory:#fbf3e0; --ivory-2:#efe2c3; --jade:#2f8f6f; --jade-dark:#1d6a51;
    --ink:#1d1a16; --paper:#f7efdc;
    --lacquer:#b3261e; --lacquer-dark:#7d1712; --gold:#d9a93b; --gold-light:#f3d27a;
    --ok:#7fe0a8; --bad:#ff8a7a;
    --font-ui:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    --font-title:"Song Myung","Gowun Batang",serif;
    --font-num:"Gowun Batang","Noto Serif KR",serif;
    --tw: clamp(34px, min(4.6vw, 7.6vh), 60px);   /* 내 패 타일 너비 */
    --th: calc(var(--tw) * 1.38);
    --ctl-h: 46px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden;}
  body{
    font-family:var(--font-ui); color:var(--paper); font-synthesis:none;
    background:radial-gradient(ellipse at 50% 40%, var(--felt-light) 0%, var(--felt) 55%, var(--felt-deep) 100%);
    background-color:var(--felt);
    user-select:none; -webkit-user-select:none;
  }
  /* 펠트 결 */
  body::before{content:""; position:fixed; inset:0; pointer-events:none; opacity:.18;
    background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.25) 0 1px, transparent 1px 4px);}
  .nofont body{font-weight:700; font-synthesis:weight;}
  button{font-family:inherit; cursor:pointer; border:none; color:inherit;}
  button:focus-visible{outline:3px solid var(--gold-light); outline-offset:3px;}
  input{font-family:inherit;}
  .hidden{display:none !important;}
  .screen{position:relative; height:100%; z-index:1;}

  /* ---------- 버튼 ---------- */
  .btn{
    height:50px; padding:0 22px; border-radius:12px; font-size:18px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    color:var(--ink); background:linear-gradient(180deg, var(--ivory) 0%, var(--ivory-2) 100%);
    box-shadow:0 4px 0 #b9a77c, 0 6px 12px rgba(0,0,0,.3);
    transition:transform .07s, box-shadow .07s;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #b9a77c;}
  .btn:disabled{opacity:.42; pointer-events:none;}
  .btn.red{color:#fff6e6; background:linear-gradient(180deg, #c9342b 0%, var(--lacquer) 100%); box-shadow:0 4px 0 var(--lacquer-dark), 0 6px 12px rgba(0,0,0,.3); border:1.5px solid var(--gold);}
  .btn.red:active{box-shadow:0 1px 0 var(--lacquer-dark);}
  .btn.ghost{background:rgba(0,0,0,.22); color:var(--paper); box-shadow:none; border:1.5px solid rgba(243,210,122,.55);}
  .btn.big{height:60px; font-size:21px; padding:0 30px; border-radius:14px;}
  .btn.small{height:40px; font-size:16px; padding:0 14px; border-radius:10px; box-shadow:0 3px 0 #b9a77c;}

  /* ---------- 타일(돌) ---------- */
  .tile{
    width:var(--tw); height:calc(var(--tw) * 1.38); flex:0 0 auto; position:relative;   /* 높이는 각 타일의 너비 기준으로 (작은 타일도 비율 유지) */
    border-radius:calc(var(--tw)*.16);
    background:linear-gradient(180deg, #fffaf0 0%, var(--ivory) 60%, var(--ivory-2) 100%);
    box-shadow:0 calc(var(--tw)*.08) 0 var(--jade), 0 calc(var(--tw)*.08 + 1px) 0 var(--jade-dark), 0 calc(var(--tw)*.12) calc(var(--tw)*.14) rgba(0,0,0,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--tw)*.04);
    color:var(--ink); touch-action:none; cursor:pointer;
    transition:transform .12s;
  }
  .tile .n{font-family:var(--font-num); font-weight:700; font-size:calc(var(--tw)*.56); line-height:1; letter-spacing:-.04em;}
  .tile svg{width:calc(var(--tw)*.42); height:calc(var(--tw)*.42); display:block;}
  .tile.sel{transform:translateY(calc(var(--tw)*-.28)); box-shadow:0 0 0 3px var(--gold-light), 0 calc(var(--tw)*.08) 0 var(--jade), 0 calc(var(--tw)*.3) calc(var(--tw)*.3) rgba(0,0,0,.4);}
  .tile.mini{--tw:26px; cursor:default; box-shadow:0 2px 0 var(--jade), 0 3px 4px rgba(0,0,0,.3);}
  .tile.mini .n{font-size:14px;}
  .tile.mini svg{width:11px; height:11px;}
  .drag-ghost{position:fixed; z-index:999; pointer-events:none; transform:translate(-50%,-60%) rotate(-4deg) scale(1.08);}

  /* ---------- 입장 화면 ---------- */
  #entry{display:flex; padding:16px; overflow-y:auto;}
  .entry-wrap{margin:auto; width:min(540px,100%); display:flex; flex-direction:column; align-items:center; gap:20px;}
  .title-row{display:flex; gap:8px; align-items:flex-end;}
  .title-row .tile{--tw:54px; cursor:default;}
  .title-row .tile:nth-child(1){transform:rotate(-8deg) translateY(4px);}
  .title-row .tile:nth-child(2){transform:rotate(3deg) translateY(-4px);}
  .title-row .tile:nth-child(3){transform:rotate(-2deg);}
  .title-row .tile:nth-child(4){transform:rotate(9deg) translateY(2px);}
  .app-title{font-family:var(--font-title); font-size:clamp(46px,8vw,68px); line-height:1; color:var(--gold-light); letter-spacing:.18em; text-shadow:0 3px 0 var(--lacquer-dark), 0 6px 14px rgba(0,0,0,.4); margin-right:-.18em;}
  .panel{
    width:100%; padding:22px 24px; border-radius:18px; color:var(--ink);
    background:linear-gradient(180deg, #fffaf0, var(--ivory));
    border:6px solid var(--wood); box-shadow:inset 0 0 0 2px var(--gold), 0 10px 24px rgba(0,0,0,.35);
    display:flex; flex-direction:column; gap:16px;
  }
  .field{display:flex; align-items:center; gap:12px;}
  .field label{font-size:18px; flex:0 0 auto; width:56px;}
  .field input{flex:1; height:50px; border-radius:12px; border:2px solid #cdbb8f; background:#fff; padding:0 14px; font-size:20px; color:var(--ink);}
  .field input:focus{outline:none; border-color:var(--lacquer);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .note{font-size:15px; color:#7b6a48; text-align:center; line-height:1.5;}
  .entry-foot{width:100%; display:flex; justify-content:space-between; align-items:center;}
  .ver{font-size:13px; opacity:.55;}

  /* ---------- 대기실 ---------- */
  #lobby{display:flex; padding:16px; overflow-y:auto;}
  .lobby-wrap{margin:auto; width:min(720px,100%); display:flex; flex-direction:column; gap:16px;}
  .code-line{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;}
  .code-line .lbl{font-size:18px; color:#6b5a38;}
  .code-big{display:flex; gap:8px;}
  .code-big span{width:58px; height:74px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-num); font-weight:700; font-size:42px; color:var(--lacquer);
    background:linear-gradient(180deg,#fffaf0,var(--ivory)); box-shadow:0 5px 0 var(--jade), 0 6px 0 var(--jade-dark), 0 8px 12px rgba(0,0,0,.25); border:1px solid #e3d3ac;}
  .code-big span.empty{color:transparent; background:#e9dcb9; box-shadow:inset 0 2px 4px rgba(0,0,0,.15);}
  .seats{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  .seat{height:74px; border-radius:12px; border:2px dashed #cdbb8f; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:17px; color:#9b8a64; text-align:center; padding:0 4px;}
  .seat.filled{border-style:solid; border-color:var(--wood-light); background:#fff; color:var(--ink);}
  .seat.cpu{border-style:solid; border-color:#cdbb8f; background:#f3ead2; color:#6b5a38;}
  .seat .who{font-size:13px; color:#8a7752;}
  .seat .nm{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .opts{display:grid; grid-template-columns:76px 1fr; row-gap:10px; align-items:center;}
  .opts .ol{font-size:17px; color:#6b5a38;}
  .tgs{display:grid; gap:8px;}
  .tgs.c2{grid-template-columns:repeat(2,1fr);} .tgs.c3{grid-template-columns:repeat(3,1fr);} .tgs.c4{grid-template-columns:repeat(4,1fr);}
  .tg{height:44px; border-radius:10px; font-size:17px; background:#fff; color:var(--ink); border:2px solid #cdbb8f;}
  .tg.on{background:var(--lacquer); border-color:var(--lacquer-dark); color:#fff6e6;}
  .tg:disabled{cursor:default;}
  .tg:disabled:not(.on){opacity:.55;}
  .wait-msg{text-align:center; font-size:17px; color:#6b5a38;}
  .lobby-actions{display:flex; gap:12px; justify-content:center;}
  .lobby-actions .btn{flex:1; max-width:260px;}

  /* ---------- 게임 화면 ---------- */
  #game{display:flex; flex-direction:column; gap:10px; padding:10px 12px 12px;}
  .topbar{flex:0 0 auto; display:flex; align-items:center; gap:8px; min-height:var(--ctl-h);}
  .chipbtn{
    height:var(--ctl-h); min-width:var(--ctl-h); padding:0 12px; border-radius:12px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; gap:6px; font-size:16px; white-space:nowrap;
    background:rgba(0,0,0,.28); color:var(--paper); border:1.5px solid rgba(243,210,122,.45);
  }
  .chipbtn.icon{padding:0; font-size:21px;}
  .round-tag{font-family:var(--font-num); font-weight:700; font-size:17px;}
  .opps{flex:1; min-width:0; display:flex; gap:8px; justify-content:center; overflow:visible;}   /* '패스' 꼬리표가 잘리지 않게 */
  .opp{
    height:var(--ctl-h); padding:0 12px; border-radius:12px; display:flex; align-items:center; gap:8px;
    background:rgba(0,0,0,.28); border:1.5px solid transparent; font-size:16px; white-space:nowrap; position:relative; min-width:0;
  }
  .opp .nm{max-width:7.5em; overflow:hidden; text-overflow:ellipsis;}
  .opp .cnt, .opp .chips{display:flex; align-items:center; gap:3px; font-family:var(--font-num); font-weight:700;}
  .opp .back{width:12px; height:16px; border-radius:3px; background:linear-gradient(180deg,var(--jade),var(--jade-dark)); box-shadow:inset 0 0 0 1.5px var(--ivory);}
  .opps.many .opp{padding:0 8px; gap:5px; font-size:14px;}
  .opps.many .opp .nm{max-width:4.2em;}
  .opp.turn{border-color:var(--gold-light); background:rgba(217,169,59,.25);}
  .opp .tag{position:absolute; top:-9px; right:-6px; font-size:12px; padding:1px 6px; border-radius:8px; background:var(--ivory); color:var(--ink);}
  .opp .tag.pass{background:#6b7f78; color:#fff;}
  .opp .tag.away{background:var(--lacquer); color:#fff;}

  .table{
    flex:1 1 0; min-height:0; position:relative; border-radius:24px;
    border:12px solid var(--wood);
    background:radial-gradient(ellipse at center, var(--felt-light), var(--felt) 70%);
    box-shadow:inset 0 0 0 2px var(--gold), inset 0 8px 24px rgba(0,0,0,.35), 0 0 0 2px var(--wood-dark), 0 10px 20px rgba(0,0,0,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:12px; overflow:hidden;
  }
  .table::before{content:""; position:absolute; inset:-12px; border-radius:24px; pointer-events:none;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 9px); mask:linear-gradient(#000,#000) content-box exclude, linear-gradient(#000,#000); -webkit-mask:linear-gradient(#000,#000) content-box, linear-gradient(#000,#000); -webkit-mask-composite:xor; padding:12px;}
  .t-head{font-size:clamp(17px,2.2vw,22px); text-align:center; min-height:1.4em;}
  .t-head b{font-family:var(--font-num); color:var(--gold-light);}
  .t-tiles{display:flex; gap:8px; min-height:calc(var(--ttw) * 1.38 + 12px); align-items:center; --ttw:clamp(44px, min(6.4vw, 11vh), 84px);}
  .t-tiles .tile{--tw:var(--ttw); cursor:default; animation:drop .28s ease-out;}
  @keyframes drop{from{transform:translateY(-18px) scale(1.06); opacity:0;} to{transform:none; opacity:1;}}
  .t-empty{font-size:18px; opacity:.75; border:2px dashed rgba(247,239,220,.35); border-radius:14px; padding:18px 26px;}
  .t-foot{display:flex; align-items:center; gap:14px; font-size:16px; flex-wrap:wrap; justify-content:center;}
  .turn-pill{height:40px; padding:0 16px; border-radius:20px; display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.3); border:1.5px solid rgba(243,210,122,.4); font-size:16px;}
  .turn-pill.me{background:var(--lacquer); border-color:var(--gold); color:#fff6e6;}
  .turn-pill .sec{font-family:var(--font-num); font-weight:700; font-size:19px; min-width:1.6em; text-align:right;}
  .turn-pill.hurry{animation:hurry .5s ease-in-out infinite alternate;}
  @keyframes hurry{from{transform:none;} to{transform:scale(1.07);}}
  .passes{opacity:.8;}

  .tray{flex:0 0 auto; display:flex; flex-direction:column; gap:8px;}
  .preview{height:40px; border-radius:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 14px; background:rgba(0,0,0,.28); font-size:17px;}
  .preview .pv{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .preview .pv.flash{animation:flashIn .25s ease-out;}
  @keyframes flashIn{from{transform:translateY(4px); opacity:0;} to{transform:none; opacity:1;}}
  .preview .pv.ok{color:var(--ok);} .preview .pv.bad{color:var(--bad);} .preview .pv.info{color:var(--gold-light);}
  .preview .me-info{display:flex; align-items:center; gap:10px; white-space:nowrap; font-family:var(--font-num); font-weight:700;}
  .rack{
    position:relative; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; justify-content:center;
    padding:calc(var(--tw)*.36) 12px 14px; border-radius:16px; min-height:calc(var(--th) + var(--tw)*.36 + 22px);
    background:linear-gradient(180deg, var(--wood-light), var(--wood)); box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -4px 0 var(--wood-dark), 0 6px 14px rgba(0,0,0,.35);
  }
  .rack-in{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; row-gap:calc(var(--tw)*.18);}
  .ins-mark{position:absolute; width:5px; border-radius:3px; background:var(--gold-light); box-shadow:0 0 0 2px var(--lacquer-dark); pointer-events:none; display:none; z-index:3;}
  .actions{display:grid; grid-template-columns:auto auto 1fr auto auto; gap:10px; align-items:center;}
  .actions .btn{height:50px;}
  .actions .play{min-width:140px;}

  /* ---------- 알림·팝업 ---------- */
  .toast{position:fixed; left:50%; top:66px; transform:translate(-50%,-6px); z-index:50; max-width:min(620px,92vw);
    padding:11px 20px; border-radius:14px; font-size:17px; text-align:center; background:var(--ivory); color:var(--ink);
    box-shadow:0 6px 18px rgba(0,0,0,.35); border:2px solid var(--gold); opacity:0; transition:opacity .2s, transform .2s; pointer-events:none;}
  .toast.show{opacity:1; transform:translate(-50%,0);}
  .toast.err{background:var(--lacquer); color:#fff6e6;}
  .overlay{position:fixed; inset:0; z-index:100; background:rgba(5,25,20,.62); display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal{
    width:min(560px,100%); max-height:92vh; overflow-y:auto; border-radius:18px; padding:22px 24px; color:var(--ink);
    background:linear-gradient(180deg,#fffaf0,var(--ivory)); border:6px solid var(--wood); box-shadow:inset 0 0 0 2px var(--gold), 0 16px 40px rgba(0,0,0,.45);
    animation:pop .18s ease-out;
  }
  .modal.wide{width:min(720px,100%);}
  @keyframes pop{from{transform:scale(.95); opacity:0;} to{transform:none; opacity:1;}}
  .modal h2{margin:0 0 12px; font-family:var(--font-title); font-weight:400; font-size:30px; text-align:center; color:var(--lacquer);}
  .modal h3{margin:16px 0 8px; font-size:19px; color:var(--wood);}
  .modal p{margin:6px 0; font-size:16px; line-height:1.6;}
  .modal .sub{text-align:center; color:#6b5a38;}
  .modal-actions{display:flex; gap:10px; justify-content:center; margin-top:18px;}
  .modal-actions .btn{flex:1; max-width:220px;}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px;}
  .keypad button{height:54px; border-radius:12px; font-family:var(--font-num); font-weight:700; font-size:26px; background:#fff; color:var(--ink); border:2px solid #cdbb8f;}
  .keypad button.fn{font-family:var(--font-ui); font-weight:400; font-size:17px; background:#f3ead2;}
  table.res{width:100%; border-collapse:collapse; font-size:16px;}
  table.res th, table.res td{padding:8px 6px; border-bottom:1px dashed #d6c49a; text-align:center; vertical-align:middle;}
  table.res th{font-size:14px; color:#8a7752; font-weight:400;}
  table.res td:first-child, table.res th:first-child{text-align:left;}
  table.res .left-tiles{display:flex; flex-wrap:wrap; gap:3px; justify-content:center; padding-bottom:3px;}
  table.res .plus{color:#2e7d32; font-family:var(--font-num); font-weight:700;} table.res .minus{color:var(--lacquer); font-family:var(--font-num); font-weight:700;}
  table.res tr.me td{background:#fff4d6;}
  .rank1{font-size:22px;}
  .count-note{text-align:center; color:#8a7752; font-size:15px; margin-top:8px;}
  /* 족보표 */
  .rk{display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:4px 0 2px;}
  .rk .tile{--tw:30px; cursor:default; box-shadow:0 2px 0 var(--jade), 0 3px 4px rgba(0,0,0,.25);}
  .rk .tile .n{font-size:16px;} .rk .tile svg{width:12px; height:12px;}
  .rk .gt{color:#a08a5a; font-size:14px;}
  .combo-list{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:center; font-size:15px;}
  .combo-list .cn{font-weight:700; color:var(--wood); white-space:nowrap;}
  .st-table{width:100%; border-collapse:collapse; font-size:15px;}
  .st-table td{padding:5px 6px; border-bottom:1px dashed #e0cfa6;}
  .menu-list{display:flex; flex-direction:column; gap:10px;}
  .menu-list .btn{width:100%;}

  /* ---------- 화면 크기 ---------- */
  @media (max-height:640px){
    :root{--ctl-h:42px;}
    .table{gap:6px; padding:8px;}
    .t-tiles{--ttw:clamp(36px, min(6vw, 8.6vh), 70px); min-height:calc(var(--ttw) * 1.38 + 6px);}
    .t-head{font-size:17px;}
    .turn-pill{height:34px;}
    #game{gap:7px; padding:8px 10px 10px;}
    .table{border-width:9px;}
    .preview{height:36px; font-size:16px;}
    .actions .btn{height:44px;}
  }
  @media (max-width:900px){
    .opp{padding:0 9px; gap:6px; font-size:15px;}
    .opp .nm{max-width:4.5em;}
    .seats{grid-template-columns:repeat(5,1fr);}
  }
  @media (max-width:900px){
    .topbar{flex-wrap:wrap;}
    .opps{order:10; flex-basis:100%; flex-wrap:wrap; justify-content:center; row-gap:6px;}
    .round-tag{margin-right:auto;}
  }
  @media (max-width:760px){
    .actions{grid-template-columns:1fr 1fr 1fr 1.5fr;}
    .actions .spacer{display:none;}
    .actions .btn{padding:0 8px;}
    .actions .play{min-width:0;}
    .seats{grid-template-columns:repeat(3,1fr);}
  }
  @media (orientation: portrait){ .t-tiles{--ttw:clamp(44px, min(13vw, 8vh), 84px);} }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>

<!-- ============ 입장 ============ -->
<div id="entry" class="screen">
  <div class="entry-wrap">
    <div class="title-row" id="titleTiles"></div>
    <div class="app-title" id="appTitle"></div>
    <div class="panel">
      <div class="field"><label for="nameInput">별명</label><input id="nameInput" maxlength="8" placeholder="8자 이내" autocomplete="off"></div>
      <div class="row2">
        <button class="btn red big" id="createBtn">방 만들기</button>
        <button class="btn big" id="joinBtn">코드로 들어가기</button>
      </div>
      <button class="btn big" id="practiceBtn">혼자 연습 (컴퓨터와)</button>

<script>
/* =====================================================================

   ===================================================================== */
const CONFIG = {
  APP_NAME: '렉시오',
  APP_VERSION: 'v1.1',          // 고쳐서 다시 올리면 올려 주세요(대기실·결과 화면에 표시)
  START_CHIPS: 100,             // 한 사람 시작 칩
  TURN_SECONDS: 30,             // 사람 한 턴 시간. 넘으면 자동 패스(선 차례면 가장 낮은 타일 1장 자동)
  ROUND_OPTIONS: [3, 5],        // 판 수 선택지
  SEAT_OPTIONS: [3, 4, 5],      // 온라인 인원 선택지 (모자란 자리는 컴퓨터)
  PRACTICE_SEAT_OPTIONS: [3, 4, 5, 6],   // 혼자 연습 인원 선택지 (6명이면 한 사람 10장)
  DEFAULTS: { rounds: 3, seats: 4, level: 0 },
  CPU_THINK_MS: { MIN: 1800, MAX: 3200 },   // 컴퓨터가 생각하는 시간
  AWAY_THINK_MS: 1500,          // 연결 끊긴 사람 대신 둘 때 기다리는 시간
  ROUND_RESULT_SEC: 9,          // 판 정산표를 보여 주는 시간
  HOST_TIMEOUT_SEC: 30,         // 방장(심판)이 이만큼 끊기면 다른 사람이 심판을 이어받음
  HOST_BEAT_SEC: 4,             // 방장이 "살아 있어요" 신호를 보내는 간격
  ROOM_EXPIRE_HOURS: 24,        // 이보다 오래된 방은 새 방을 만들 때 함께 지움
  // 문양: 순서 = 약한 것 → 강한 것 (구름 < 별 < 달 < 해)
  SUITS: [
    { key: 'cloud', name: '구름', color: '#1f5fb8' },
    { key: 'star',  name: '별',   color: '#a8740a' },
    { key: 'moon',  name: '달',   color: '#2e7d32' },
    { key: 'sun',   name: '해',   color: '#c0392b' },
  ],
  CPU_NAMES: ['컴퓨터1', '컴퓨터2', '컴퓨터3', '컴퓨터4', '컴퓨터5'],
};

/* Firebase 설정값 — 사용안내 2단계에서 복사해 붙여넣으세요. 비어 있으면 '혼자 연습'만 됩니다. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBOP7Doq-tlQDoFttcK5XPxd07HiHKO3RA",
  authDomain: "lexio-bcb39.firebaseapp.com",
  databaseURL: "https://lexio-bcb39-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lexio-bcb39",
  appId: "1:910770087464:web:73a2f8c0d40c1d50d8f71d",
};

/*LOGIC-START*/
/* =====================================================================
   게임 규칙 (화면·서버와 분리된 순수 로직)
   타일 번호 0~59: 문양 = floor(id/15) (0 구름 ~ 3 해), 숫자 = id%15 + 1
   ===================================================================== */
const SUIT_OF = id => Math.floor(id / 15);
const NUM_OF = id => (id % 15) + 1;
const CLOUD3 = 2;                                      // 구름 3 — 첫 판 시작 타일
// 숫자 서열: 3(가장 약함) … 15, 1, 2(가장 강함)
function rankOfNum(n){ return n >= 3 ? n - 3 : n === 1 ? 13 : 14; }
function strength(id){ return rankOfNum(NUM_OF(id)) * 4 + SUIT_OF(id); }
const byStrength = (a, b) => strength(a) - strength(b);
const bySuit = (a, b) => SUIT_OF(a) - SUIT_OF(b) || rankOfNum(NUM_OF(a)) - rankOfNum(NUM_OF(b));

// 스트레이트 목록 (확정 규칙): 1·2·3·4·5 … 11·12·13·14·15, 12·13·14·15·1, 13·14·15·1·2 — 마지막 숫자가 '맨 위'
const STRAIGHTS = (() => {
  const list = [];
  for (let a = 1; a <= 11; a++) list.push([a, a + 1, a + 2, a + 3, a + 4]);
  list.push([12, 13, 14, 15, 1]);
  list.push([13, 14, 15, 1, 2]);
  return list.map(seq => ({ top: seq[4], sig: seq.slice().sort((x, y) => x - y).join(',') }));
})();
function straightTop(nums){
  const sig = nums.slice().sort((x, y) => x - y).join(',');
  const hit = STRAIGHTS.find(s => s.sig === sig);
  return hit ? hit.top : null;
}

// 다섯 장 족보 종류(약 → 강)
const FIVE = { STRAIGHT: 1, FLUSH: 2, FULLHOUSE: 3, FOUR: 4, STRAIGHTFLUSH: 5 };

/* 조합 판정. 맞으면 { size, key, name }, 아니면 null.
   key가 클수록 강함. 같은 장수끼리만 비교. 다섯 장은 종류×1000 + 세부 세기 */
function evaluate(ids){
  const n = ids.length;
  if (![1, 2, 3, 5].includes(n) || new Set(ids).size !== n) return null;
  const nums = ids.map(NUM_OF);
  if (n <= 3) {
    if (!nums.every(x => x === nums[0])) return null;
    const top = ids.reduce((a, b) => strength(a) > strength(b) ? a : b);
    const label = n === 1 ? '싱글' : n === 2 ? '페어' : '트리플';
    return { size: n, key: strength(top), name: `${label} ${nums[0]}` };
  }
  const cnt = {};
  nums.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
  const groups = Object.entries(cnt).map(([k, v]) => [Number(k), v]).sort((a, b) => b[1] - a[1]);
  const flush = ids.every(id => SUIT_OF(id) === SUIT_OF(ids[0]));
  const st = straightTop(nums);
  if (st !== null) {
    const topId = ids.find(id => NUM_OF(id) === st);
    const sub = rankOfNum(st) * 4 + SUIT_OF(topId);
    return flush
      ? { size: 5, key: FIVE.STRAIGHTFLUSH * 1000 + sub, name: `스트레이트 플러시 ${st}` }
      : { size: 5, key: FIVE.STRAIGHT * 1000 + sub, name: `${st} 스트레이트` };
  }
  if (flush) {
    const top = ids.reduce((a, b) => strength(a) > strength(b) ? a : b);
    return { size: 5, key: FIVE.FLUSH * 1000 + strength(top), name: `플러시 ${NUM_OF(top)}` };
  }
  if (groups[0][1] === 3 && groups[1][1] === 2)
    return { size: 5, key: FIVE.FULLHOUSE * 1000 + rankOfNum(groups[0][0]), name: `풀하우스 ${groups[0][0]}` };
  if (groups[0][1] === 4)
    return { size: 5, key: FIVE.FOUR * 1000 + rankOfNum(groups[0][0]), name: `포카드 ${groups[0][0]}` };
  return null;
}
function beats(ev, tableEv){ return !!ev && (!tableEv || (ev.size === tableEv.size && ev.key > tableEv.key)); }

/* 내기 전 미리보기 문구 */
function previewText(sel, table, myTurn){
  if (!sel.length) return table ? { cls: 'info', text: `${table.ev.size}장으로 더 높게 내거나 패스하세요` } : { cls: 'info', text: '자유롭게 내세요 · 장수도 정할 수 있어요' };
  const ev = evaluate(sel);
  if (!ev) return { cls: 'bad', text: sel.length === 4 ? '4장은 낼 수 없어요 (1·2·3·5장)' : '족보가 아니에요' };
  if (table && ev.size !== table.ev.size) return { cls: 'bad', text: `${ev.name} — 장수가 달라요 (앞은 ${table.ev.size}장)` };
  if (table && ev.key <= table.ev.key) return { cls: 'bad', text: `${ev.name} — 앞 조합(${table.ev.name})보다 낮아요` };
  return { cls: 'ok', text: `${ev.name} — ${myTurn ? '낼 수 있어요' : '내 차례가 되면 낼 수 있어요'}` };
}

/* 손패에서 만들 수 있는 조합 (size 지정 시 그 장수만) */
function combos(hand, size){
  const out = [];
  const byNum = {};
  hand.forEach(id => (byNum[NUM_OF(id)] = byNum[NUM_OF(id)] || []).push(id));
  if (!size || size === 1) hand.forEach(id => out.push([id]));
  if (!size || size === 2) Object.values(byNum).forEach(g => { for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) out.push([g[i], g[j]]); });
  if (!size || size === 3) Object.values(byNum).forEach(g => { if (g.length >= 3) for (let a = 0; a < g.length; a++) for (let b = a + 1; b < g.length; b++) for (let c = b + 1; c < g.length; c++) out.push([g[a], g[b], g[c]]); });
  if ((!size || size === 5) && hand.length >= 5) {
    const h = hand, L = h.length;
    for (let a = 0; a < L; a++) for (let b = a + 1; b < L; b++) for (let c = b + 1; c < L; c++) for (let d = c + 1; d < L; d++) for (let e = d + 1; e < L; e++) {
      const five = [h[a], h[b], h[c], h[d], h[e]];
      if (evaluate(five)) out.push(five);
    }
  }
  return out;
}
function lowestTile(hand){ return hand.slice().sort(byStrength)[0]; }

/* 컴퓨터의 수. table 이 없으면 반드시 냄(선), 있으면 tiles 또는 null(패스) */
function cpuChoose(hand, table, level, minOtherCount, rnd){
  rnd = rnd || Math.random;
  const opts = [];
  for (const c of combos(hand, table ? table.ev.size : 0)) {
    const ev = evaluate(c);
    if (ev && beats(ev, table && table.ev)) opts.push({ tiles: c, ev });
  }
  if (!opts.length) return table ? null : [lowestTile(hand)];
  const maxRank = t => Math.max(...t.map(id => rankOfNum(NUM_OF(id))));
  const has2 = t => t.some(id => NUM_OF(id) === 2);
  if (table) {
    opts.sort((a, b) => a.ev.key - b.ev.key);
    const best = opts[0];
    if (best.tiles.length === hand.length) return best.tiles;                  // 이걸로 끝나면 바로
    if (level === 0 && hand.length > 3 && rnd() < 0.25) return null;            // 쉬움: 가끔 그냥 패스
    if (level >= 1 && has2(best.tiles) && hand.length > 6 && minOtherCount > 4) return null;  // 보통: 2는 아껴 둠
    return best.tiles;
  }
  // 선: 낮은 숫자를 많이 털어내는 조합을 고름
  if (level === 0) {
    const small = opts.filter(o => o.ev.size <= 2).sort((a, b) => a.ev.key - b.ev.key);
    return (rnd() < 0.5 && small.length > 1 ? small[1] : small[0]).tiles;
  }
  let best = null, bestCost = Infinity;
  for (const o of opts) {
    let cost = maxRank(o.tiles) - o.tiles.length * 2.6;
    if (has2(o.tiles) && hand.length > o.tiles.length + 3) cost += 12;
    if (o.tiles.length === hand.length) cost = -999;
    if (cost < bestCost || (cost === bestCost && o.ev.key < best.ev.key)) { best = o; bestCost = cost; }
  }
  return best.tiles;
}

/* 판 정산: 타일이 더 많은 사람이 적은 사람에게 차이만큼, 손에 남은 2 한 장마다 한 배씩 더 */
function settle(hands){
  const n = hands.length;
  const rows = hands.map(h => {
    const twos = h.filter(id => NUM_OF(id) === 2).length;
    return { count: h.length, twos, mult: 1 + twos, delta: 0 };
  });
  const transfers = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if (rows[i].count > rows[j].count) {
      const amt = (rows[i].count - rows[j].count) * rows[i].mult;
      rows[i].delta -= amt; rows[j].delta += amt;
      transfers.push({ from: i, to: j, amt });
    }
  }
  return { rows, transfers };
}

function shuffled(n, rnd){
  rnd = rnd || Math.random;
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(rnd() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; }
  return a;
}

/* =====================================================================
   판 진행 엔진 — 혼자 연습에서는 이 태블릿이, 온라인에서는 방장(심판) 태블릿이 돌립니다.
   io = { now(), commit(G, H), isAway(seatIndex) }
   G: 모두가 보는 판 상태 / H: 패 (owner id → 타일 배열, 본인·심판만 볼 수 있게 저장)
   ===================================================================== */
function makeEngine(io){
  let G = null, H = {};
  const seatName = i => G.seats[i].name;
  const isAuto = i => G.seats[i].cpu || io.isAway(i);
  const think = i => G.seats[i].cpu
    ? CONFIG.CPU_THINK_MS.MIN + Math.random() * (CONFIG.CPU_THINK_MS.MAX - CONFIG.CPU_THINK_MS.MIN)
    : CONFIG.AWAY_THINK_MS;
  const next = i => (i + 1) % G.seats.length;
  const commit = () => io.commit(G, H);

  function newGame(seats, settings){
    G = {
      v: CONFIG.APP_VERSION, gameId: Math.random().toString(36).slice(2, 8), round: 0, totalRounds: settings.rounds, level: settings.level,
      seats: seats.map(s => ({ id: s.id, name: s.name, cpu: !!s.cpu, chips: CONFIG.START_CHIPS, count: 0, away: false })),
      phase: 'play', lastWinner: null, turnId: 0, table: null, passes: [], log: '',
    };
    startRound();
  }
  function startRound(){
    G.round++;
    const n = G.seats.length, per = 60 / n, deck = shuffled(60);
    H = {};
    G.seats.forEach((s, i) => { H[s.id] = deck.slice(i * per, (i + 1) * per).sort(byStrength); s.count = per; });
    const starter = G.round === 1 ? G.seats.findIndex(s => H[s.id].includes(CLOUD3)) : G.lastWinner;
    G.table = null; G.leader = starter; G.passes = []; G.result = null; G.phase = 'play';
    G.log = G.round === 1 ? `${seatName(starter)}부터 시작해요 (구름 3)` : `${seatName(starter)}부터 시작해요 (지난 판 1등)`;
    setTurn(starter);
    commit();
  }
  function setTurn(i){
    G.turn = i; G.turnId++;
    G.turnEnds = io.now() + CONFIG.TURN_SECONDS * 1000;
    G.cpuAt = isAuto(i) ? io.now() + think(i) : 0;
  }

  /* 사람(또는 컴퓨터)의 행동 적용. 틀리면 { ok:false, reason } */
  function act(i, kind, tiles){
    if (!G || G.phase !== 'play') return { ok: false, reason: '지금은 낼 수 없어요' };
    if (G.turn !== i) return { ok: false, reason: '내 차례가 아니에요' };
    const owner = G.seats[i].id, hand = H[owner] || [];
    if (kind === 'pass') {
      if (!G.table) return { ok: false, reason: '선 차례에는 패스할 수 없어요' };
      G.passes.push(i);
      G.log = `${seatName(i)} 패스`;
      if (G.passes.length >= G.seats.length - 1) {            // 나머지 모두 패스 → 마지막에 낸 사람이 새로 시작
        G.table = null; G.passes = [];
        G.log += ` → ${seatName(G.leader)}부터 새로 시작`;
        setTurn(G.leader);
      } else setTurn(next(i));
      commit();
      return { ok: true };
    }
    tiles = (tiles || []).map(Number);
    if (!tiles.length || !tiles.every(id => hand.includes(id))) return { ok: false, reason: '내 패에 없는 타일이에요' };
    const ev = evaluate(tiles);
    if (!ev) return { ok: false, reason: '족보가 아니에요' };
    if (!beats(ev, G.table && G.table.ev)) return { ok: false, reason: G.table && ev.size !== G.table.ev.size ? '장수가 달라요' : '앞 조합보다 낮아요' };
    H[owner] = hand.filter(id => !tiles.includes(id));
    G.seats[i].count = H[owner].length;
    G.table = { tiles: tiles.slice().sort(byStrength), by: i, ev: { size: ev.size, key: ev.key, name: ev.name }, turnId: G.turnId };
    G.leader = i; G.passes = [];
    G.log = `${seatName(i)}이(가) 냈어요 · ${ev.name}`;
    if (!H[owner].length) endRound(i);
    else { setTurn(next(i)); commit(); }
    return { ok: true };
  }

  function autoMove(i, why){
    const owner = G.seats[i].id, hand = H[owner] || [];
    let tiles;
    if (why === 'timeout') tiles = G.table ? null : [lowestTile(hand)];
    else {
      const minOther = Math.min(...G.seats.filter((_, k) => k !== i).map(s => s.count));
      tiles = cpuChoose(hand, G.table, G.seats[i].cpu ? G.level : 1, minOther);
    }
    const r = tiles ? act(i, 'play', tiles) : act(i, 'pass');
    if (!r.ok) act(i, G.table ? 'pass' : 'play', G.table ? null : [lowestTile(hand)]);   // 안전장치
    if (why === 'timeout' && G.phase === 'play') { G.log = `⏰ ${seatName(i)} 시간 초과 · ` + G.log; commit(); }
  }

  function endRound(winner){
    const order = G.seats.map(s => H[s.id] || []);
    const s = settle(order);
    G.seats.forEach((seat, k) => { seat.chips = Math.max(0, seat.chips + s.rows[k].delta); });
    G.result = {
      round: G.round, winner,
      rows: s.rows.map((r, k) => Object.assign(r, { tiles: order[k].slice().sort(byStrength), chips: G.seats[k].chips })),
      transfers: s.transfers,
    };
    G.lastWinner = winner;
    G.log = `${seatName(winner)}이(가) 다 냈어요!`;
    const over = G.round >= G.totalRounds || G.seats.some(x => x.chips <= 0);
    G.phase = over ? 'over' : 'roundEnd';
    G.nextAt = io.now() + CONFIG.ROUND_RESULT_SEC * 1000;
    commit();
  }

  /* 0.3초마다 호출: 컴퓨터·시간 초과·다음 판 */
  function tick(){
    if (!G) return;
    const t = io.now();
    if (G.phase === 'play') {
      const i = G.turn;
      if (isAuto(i)) {
        if (!G.cpuAt) { G.cpuAt = t + think(i); commit(); }
        else if (t >= G.cpuAt) autoMove(i, 'cpu');
      } else if (t >= G.turnEnds) autoMove(i, 'timeout');
    } else if (G.phase === 'roundEnd' && t >= G.nextAt) startRound();
  }

  return {
    newGame, act, tick, startRound,
    load(g, h){ G = g; H = h; },
    get game(){ return G; }, get hands(){ return H; },
    reassignSeat(i, newId){ const old = G.seats[i].id; H[newId] = H[old] || []; delete H[old]; G.seats[i].id = newId; commit(); },
    setAway(i, away){ if (G && G.seats[i] && G.seats[i].away !== away) { G.seats[i].away = away; if (G.phase === 'play' && G.turn === i) G.cpuAt = away ? io.now() + think(i) : 0; commit(); } },
  };
}
/*LOGIC-END*/

/* =====================================================================
   온라인 연결 — Firebase를 얇게 감싼 것 (시험할 때는 가짜 서버로 바꿔 끼울 수 있음)
   ===================================================================== */
function firebaseReady(){ return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL && window.firebase); }
function makeFirebaseNet(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.database();
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  return {
    uid: null,
    async init(){ if (!auth.currentUser) await auth.signInAnonymously(); this.uid = auth.currentUser.uid; },
    now: () => Date.now() + offset,
    on(path, cb){ const r = db.ref(path); const h = s => cb(s.val()); r.on('value', h, () => cb(null)); return () => r.off('value', h); },
    async get(path){ return (await db.ref(path).get()).val(); },
    set: (path, v) => db.ref(path).set(v),
    update: map => db.ref().update(map),
    remove: path => db.ref(path).remove(),
    push: (path, v) => db.ref(path).push(v),
    async txn(path, fn){ const r = await db.ref(path).transaction(fn); return r.committed; },
    onDisconnectSet: (path, v) => db.ref(path).onDisconnect().set(v),
    cancelDisconnect: path => db.ref(path).onDisconnect().cancel(),
    onConnected(cb){ db.ref('.info/connected').on('value', s => cb(!!s.val())); },
  };
}
let net = null;
async function getNet(){
  if (net) return net;
  if (window.__LEXIO_NET__) net = window.__LEXIO_NET__();      // 시험용 가짜 서버
  else if (firebaseReady()) net = makeFirebaseNet();
  else throw new Error('noconfig');
  await net.init();
  return net;
}
const arr = x => Array.isArray(x) ? x : x ? Object.values(x) : [];
function normGame(g){
  if (!g) return null;
  g.seats = arr(g.seats); g.passes = arr(g.passes);
  if (g.table) g.table.tiles = arr(g.table.tiles);
  if (g.result) { g.result.rows = arr(g.result.rows).map(r => Object.assign(r, { tiles: arr(r.tiles) })); g.result.transfers = arr(g.result.transfers); }
  return g;
}

/* ---------- 문양 그림 (기기마다 ☀☁ 글자가 이모지로 바뀌는 것을 피하려고 직접 그림) ---------- */
function suitSVG(s){
  const c = CONFIG.SUITS[s].color;
  if (s === 3) { // 해
    let rays = '';
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, x1 = 12 + Math.cos(a) * 7.6, y1 = 12 + Math.sin(a) * 7.6, x2 = 12 + Math.cos(a) * 10.6, y2 = 12 + Math.sin(a) * 10.6;
      rays += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/>`; }
    return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.2" fill="${c}"/>${rays}</svg>`;
  }
  if (s === 2) return `<svg viewBox="0 0 24 24"><path d="M15.5 3.2a9.2 9.2 0 1 0 5.6 14.6A7.4 7.4 0 0 1 15.5 3.2z" fill="${c}"/></svg>`;
  if (s === 1) return `<svg viewBox="0 0 24 24"><path d="M12 1.8l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9l7.1-.6z" fill="${c}"/></svg>`;
  return `<svg viewBox="0 0 24 24"><g fill="${c}"><circle cx="8" cy="14" r="5"/><circle cx="13.5" cy="10.5" r="6"/><circle cx="18" cy="14.5" r="4.2"/><rect x="7" y="13" width="12" height="6.2" rx="3"/></g></svg>`;
}
function tileHTML(id, cls){ return `<div class="tile ${cls || ''}" data-id="${id}"><span class="n">${NUM_OF(id)}</span>${suitSVG(SUIT_OF(id))}</div>`; }

/* ---------- 온라인: 방 만들기 / 들어가기 ---------- */
async function connectOrExplain(){
  try { return await getNet(); }
  catch (e) {
    toast(e.message === 'noconfig' ? '온라인 설정이 아직 안 됐어요' : '온라인에 연결할 수 없어요 · 혼자 연습은 할 수 있어요', true, 3600);
    return null;
  }
}
$('createBtn').onclick = async () => {
  const name = readName(); if (!name) return;
  const n = await connectOrExplain(); if (!n) return;
  $('createBtn').disabled = true;
  try {
    cleanupOldRooms(n);
    let code = null;
    for (let k = 0; k < 20 && !code; k++) {
      const c = String(1000 + Math.floor(Math.random() * 9000));
      if (await n.txn(`roomIndex/${c}`, cur => cur ? undefined : { created: n.now() })) code = c;
    }
    if (!code) throw new Error('code');
    const now = n.now();
    await n.update({
      [`rooms/${code}/meta`]: { host: n.uid, status: 'lobby', created: now, hostBeat: now, v: CONFIG.APP_VERSION, settings: CONFIG.DEFAULTS },
      [`rooms/${code}/players/${n.uid}`]: { name, joined: now, online: true },
    });
    enterRoom(code, name);
  } catch (e) { toast('방을 만들지 못했어요. 다시 해 주세요', true); }
  $('createBtn').disabled = false;
};
async function cleanupOldRooms(n){
  try {
    const idx = await n.get('roomIndex') || {};
    const limit = n.now() - CONFIG.ROOM_EXPIRE_HOURS * 3600 * 1000;
    for (const [c, v] of Object.entries(idx)) {
      if (v && v.created < limit) { n.remove(`rooms/${c}`).catch(() => {}); n.remove(`roomIndex/${c}`).catch(() => {}); }
    }
  } catch (e) {}
}

$('joinBtn').onclick = () => {
  const name = readName(); if (!name) return;
  let typed = '';
  showModal(`<h2>방 코드 입력</h2><div class="code-big" id="cDigits" style="justify-content:center"></div>
    <div class="keypad" id="cPad">${[1,2,3,4,5,6,7,8,9].map(k => `<button data-k="${k}">${k}</button>`).join('')}
      <button class="fn" data-k="clr">지우기</button><button data-k="0">0</button><button class="fn" data-k="back">←</button></div>
    <div class="modal-actions"><button class="btn" id="mNo">취소</button><button class="btn red" id="mGo" disabled>들어가기</button></div>`, m => {
      const draw = () => {
        m.querySelector('#cDigits').innerHTML = [0,1,2,3].map(i => `<span class="${typed[i] ? '' : 'empty'}">${typed[i] || ''}</span>`).join('');
        m.querySelector('#mGo').disabled = typed.length !== 4;
      };

        if (k === 'clr') typed = ''; else if (k === 'back') typed = typed.slice(0, -1); else if (typed.length < 4) typed += k;

      m.querySelector('#mGo').onclick = async () => { m.querySelector('#mGo').disabled = true; await joinRoom(typed, name); };

async function joinRoom(code, name, silent){
  const n = await connectOrExplain(); if (!n) return false;
  try {
    const meta = await n.get(`rooms/${code}/meta`);
    if (!meta) { if (!silent) toast('그런 방이 없어요', true); if (!silent) { const g = $('modalRoot').querySelector('#mGo'); if (g) g.disabled = false; } return false; }
    const players = await n.get(`rooms/${code}/players`) || {};
    const now = n.now();
    if (meta.status === 'lobby') {
      const others = Object.entries(players).filter(([u, p]) => u !== n.uid && p && p.online);
      if (!players[n.uid] && others.length >= 5) { if (!silent) toast('방이 꽉 찼어요 (최대 5명)', true); return false; }
      name = uniqueName(name, others.map(([, p]) => p.name));
      await n.set(`rooms/${code}/players/${n.uid}`, { name, joined: (players[n.uid] && players[n.uid].joined) || now, online: true });
    } else {
      // 이미 시작한 방: 같은 별명의 자리가 비어 있으면(끊긴 상태) 그 자리로 돌아감
      const game = normGame(await n.get(`rooms/${code}/game`));
      const mine = game && game.seats.find(s => s.id === n.uid);
      const back = game && game.seats.find(s => !s.cpu && s.name === name && !(players[s.id] && players[s.id].online));
      if (!mine && !back) { if (!silent) toast('들어갈 수 없는 방이에요 (이미 시작했어요)', true); return false; }
      await n.set(`rooms/${code}/players/${n.uid}`, { name: mine ? mine.name : back.name, joined: (players[n.uid] && players[n.uid].joined) || now, online: true, reclaim: true });
    }
    closeModal();
    enterRoom(code, name);
    return true;
  } catch (e) { if (!silent) toast('들어가지 못했어요. 다시 해 주세요', true); return false; }
}
function uniqueName(name, taken){
  if (!taken.includes(name)) return name;
  for (let k = 2; ; k++) { const c = (name.slice(0, 7) + k); if (!taken.includes(c)) return c; }
}

/* ---------- 방 안 (대기실 + 게임) ---------- */
function enterRoom(code, name){
  cleanup();
  S.mode = 'online'; S.code = code; S.uid = net.uid; S.name = name;
  sess.set('lexio_room', { code, name });
  const base = `rooms/${code}`;
  net.onConnected(c => {
    if (!c || S.code !== code) return;
    net.onDisconnectSet(`${base}/players/${net.uid}/online`, false);
    net.set(`${base}/players/${net.uid}/online`, true).catch(() => {});
  });
  S.unsub.push(net.on(`${base}/meta`, meta => {
    if (S.code !== code) return;
    if (!meta) { roomClosed(); return; }
    S.meta = meta;
    const amHost = meta.host === net.uid;
    if (amHost && !S.isHost) becomeHost();
    if (!amHost && S.isHost) stopHost();
    if (meta.status === 'lobby') { showScreen('lobby'); renderLobby(); }
    else showScreen('game');
  }));
  S.unsub.push(net.on(`${base}/players`, p => { S.players = p || {}; if (S.meta && S.meta.status === 'lobby') renderLobby(); if (S.isHost) hostSyncPlayers(); }));
  S.unsub.push(net.on(`${base}/game`, g => { S.rawGame = normGame(g); onGame(S.rawGame, S.hand); }));
  S.unsub.push(net.on(`${base}/hands/${net.uid}`, h => { S.hand = arr(h); if (S.rawGame) onGame(S.rawGame, S.hand); }));
  // 방장(심판) 살아 있는지 확인 → 30초 넘게 소식이 없으면 다음 사람이 이어받음
  S.timers.push(setInterval(checkHostAlive, 2000));
}
function roomClosed(){
  const wasGame = S.mode === 'online';
  cleanup(); sess.set('lexio_room', null);
  renderEntry();
  if (wasGame) toast('방이 닫혔어요', false, 3000);
}
function cleanup(){
  S.unsub.forEach(f => { try { f(); } catch (e) {} }); S.unsub = [];
  S.timers.forEach(t => clearInterval(t)); S.timers = [];
  stopHost();
  if (net && S.code) { try { net.cancelDisconnect(`rooms/${S.code}/players/${net.uid}/online`); } catch (e) {} }
  Object.assign(S, { mode: null, code: null, meta: null, players: {}, game: null, rawGame: null, hand: [], order: [], engine: null, isHost: false, lastResultShown: null });
  S.selected.clear();
  closeModal();
}
async function checkHostAlive(){
  const m = S.meta; if (!m || S.isHost || !net) return;
  if (net.now() - (m.hostBeat || 0) <= CONFIG.HOST_TIMEOUT_SEC * 1000) return;
  const cands = Object.entries(S.players).filter(([u, p]) => p && p.online && u !== m.host).sort((a, b) => a[1].joined - b[1].joined);
  if (!cands.length || cands[0][0] !== net.uid) return;
  await net.txn(`rooms/${S.code}/meta`, cur => {
    if (!cur) return undefined;
    if (net.now() - (cur.hostBeat || 0) <= CONFIG.HOST_TIMEOUT_SEC * 1000) return undefined;
    cur.host = net.uid; cur.hostBeat = net.now();
    return cur;
  });
}

/* ---------- 방장(심판) 역할 ---------- */
async function becomeHost(){
  S.isHost = true;
  const code = S.code, base = `rooms/${code}`;
  S.hostTimers = [];
  const beat = () => net.update({ [`${base}/meta/hostBeat`]: net.now() }).catch(() => {});
  beat();
  S.hostTimers.push(setInterval(beat, CONFIG.HOST_BEAT_SEC * 1000));
  S.engine = makeEngine({
    now: () => net.now(),
    commit: (G, H) => {
      const upd = { [`${base}/game`]: G };
      const hands = {}; Object.keys(H).forEach(k => hands[k] = H[k].length ? H[k] : null);
      upd[`${base}/hands`] = hands;
      net.update(JSON.parse(JSON.stringify(upd))).catch(() => {});
    },
    isAway: i => { const s = S.engine && S.engine.game && S.engine.game.seats[i]; return !!s && !s.cpu && !(S.players[s.id] && S.players[s.id].online); },
  });
  // 이어받은 경우: 판 상태와 모든 패를 읽어 와서 계속
  if (S.meta && S.meta.status !== 'lobby') {
    const g = normGame(await net.get(`${base}/game`));
    if (g) {
      const H = {};
      for (const s of g.seats) H[s.id] = arr(await net.get(`${base}/hands/${s.id}`));
      S.engine.load(g, H);
      if (g.phase === 'play') { g.turnEnds = net.now() + CONFIG.TURN_SECONDS * 1000; g.cpuAt = 0; }
      hostSyncPlayers();
      toast('이제 내가 심판을 맡아요', false, 2600);
    }
  }
  S.hostUnsubActions = net.on(`${base}/actions`, acts => {
    if (!acts || !S.engine || !S.engine.game) return;
    const G = S.engine.game;
    for (const [key, a] of Object.entries(acts)) {
      net.remove(`${base}/actions/${key}`).catch(() => {});
      const i = G.seats.findIndex(s => s.id === a.uid);
      if (i < 0 || a.turnId !== G.turnId) continue;
      const r = S.engine.act(i, a.kind, arr(a.tiles));
      if (!r.ok) net.set(`${base}/players/${a.uid}/reject`, { reason: r.reason, t: net.now() }).catch(() => {});
    }
  });
  S.hostTimers.push(setInterval(() => S.engine && S.engine.tick(), 300));
  S.hostTimers.push(setInterval(hostSyncPlayers, 2000));   // 접속 상태(끊김·재입장)를 주기적으로 다시 맞춤
  if (S.meta && S.meta.status === 'lobby') renderLobby();
}
function stopHost(){
  (S.hostTimers || []).forEach(t => clearInterval(t)); S.hostTimers = [];
  if (S.hostUnsubActions) { S.hostUnsubActions(); S.hostUnsubActions = null; }
  S.isHost = false;
}
function hostSyncPlayers(){
  const E = S.engine; if (!E || !E.game) return;
  const G = E.game;
  // 다시 들어온 사람: 같은 별명의 끊긴 자리를 새 기기에 넘겨줌
  for (const [u, p] of Object.entries(S.players)) {
    if (!p || !p.online || G.seats.some(s => s.id === u)) continue;
    const i = G.seats.findIndex(s => !s.cpu && s.name === p.name && !(S.players[s.id] && S.players[s.id].online));
    if (i >= 0) { const old = G.seats[i].id; E.reassignSeat(i, u); net.remove(`rooms/${S.code}/players/${old}`).catch(() => {}); }
  }
  G.seats.forEach((s, i) => { if (!s.cpu) E.setAway(i, !(S.players[s.id] && S.players[s.id].online)); });
}

/* ---------- 대기실 ---------- */
function renderLobby(){
  const m = S.meta; if (!m) return;
  const set = Object.assign({}, CONFIG.DEFAULTS, m.settings || {});
  $('lobbyCode').innerHTML = S.code.split('').map(d => `<span>${d}</span>`).join('');
  const humans = Object.entries(S.players).filter(([, p]) => p && p.online).sort((a, b) => a[1].joined - b[1].joined);
  const total = Math.max(set.seats, humans.length);
  let html = '';
  for (let k = 0; k < 5; k++) {
    if (k < humans.length) {
      const [u, p] = humans[k];
      html += `<div class="seat filled"><span class="who">${u === m.host ? '👑 방장' : u === net.uid ? '나' : '친구'}${u === net.uid && u !== m.host ? '' : ''}</span><span class="nm">${esc(p.name)}</span></div>`;
    } else if (k < total) html += `<div class="seat cpu"><span class="who">빈자리</span><span class="nm">🤖 컴퓨터</span></div>`;
    else html += `<div class="seat"><span class="nm">—</span></div>`;
  }
  $('lobbySeats').innerHTML = html;
  const host = m.host === net.uid;
  const row = (opt, items) => {
    const el = $('lobbyOpts').querySelector(`[data-opt="${opt}"]`);
    el.innerHTML = items.map(([v, t]) => `<button class="tg ${String(set[opt]) === String(v) ? 'on' : ''}" data-v="${v}" ${host ? '' : 'disabled'}>${t}</button>`).join('');
  };
  row('rounds', CONFIG.ROUND_OPTIONS.map(r => [r, `${r}판`]));
  row('seats', CONFIG.SEAT_OPTIONS.map(r => [r, `${r}명`]));
  row('level', [[0, '컴퓨터 쉬움'], [1, '컴퓨터 보통']]);
  $('startBtn').classList.toggle('hidden', !host);
  $('lobbyMsg').textContent = host
    ? (humans.length < 2 ? '친구들이 들어오길 기다리는 중… 혼자서도 시작할 수 있어요' : `${humans.length}명 + 컴퓨터 ${total - humans.length}명으로 시작해요`)
    : '방장이 시작하길 기다리는 중…';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
$('lobbyOpts').addEventListener('click', e => {
  const b = e.target.closest('.tg'); if (!b || b.disabled || !S.meta || S.meta.host !== net.uid) return;
  const opt = b.parentElement.dataset.opt;
  const set = Object.assign({}, CONFIG.DEFAULTS, S.meta.settings || {}, { [opt]: Number(b.dataset.v) });
  net.set(`rooms/${S.code}/meta/settings`, set).catch(() => {});
});
$('startBtn').onclick = () => hostStartGame();
function hostStartGame(){
  if (!S.isHost || !S.engine) return;
  const set = Object.assign({}, CONFIG.DEFAULTS, S.meta.settings || {});
  const humans = Object.entries(S.players).filter(([, p]) => p && p.online).sort((a, b) => a[1].joined - b[1].joined).slice(0, 5);
  const total = Math.max(set.seats, humans.length);
  const seats = humans.map(([u, p]) => ({ id: u, name: p.name }));
  for (let k = 1; seats.length < total; k++) seats.push({ id: 'cpu' + k, name: CONFIG.CPU_NAMES[k - 1], cpu: true });
  net.update({ [`rooms/${S.code}/actions`]: null });
  S.engine.newGame(seats, set);
  net.update({ [`rooms/${S.code}/meta/status`]: 'playing' });
}
$('leaveLobbyBtn').onclick = () => leaveRoom();
async function leaveRoom(){
  if (S.mode === 'online' && net) {
    const code = S.code, base = `rooms/${code}`;
    const others = Object.entries(S.players).filter(([u, p]) => p && p.online && u !== net.uid).sort((a, b) => a[1].joined - b[1].joined);
    try {
      if (S.isHost && !others.length) { await net.remove(base); await net.remove(`roomIndex/${code}`); }
      else {
        if (S.isHost) await net.update({ [`${base}/meta/host`]: others[0][0], [`${base}/meta/hostBeat`]: net.now() });
        if (S.meta && S.meta.status === 'lobby') await net.remove(`${base}/players/${net.uid}`);
        else await net.set(`${base}/players/${net.uid}/online`, false);
      }
    } catch (e) {}
  }
  cleanup(); sess.set('lexio_room', null); renderEntry();
}

/* =====================================================================
   게임 화면
   ===================================================================== */
function mySeat(){ return S.game ? S.game.seats.findIndex(s => s.id === S.uid) : -1; }
function onGame(g, hand){
  if (!g) return;
  const prevTurn = S.game && S.game.turnId;
  S.game = g;
  // 내 패 순서: 손으로 정리한 순서는 지키고, 새로 받은 타일만 정렬해서 뒤에
  const h = hand || [];
  const keep = S.order.filter(id => h.includes(id));
  const add = h.filter(id => !keep.includes(id)).sort(S.sortMode === 'suit' ? bySuit : byStrength);
  S.order = keep.length ? keep.concat(add) : add;
  S.hand = h;
  [...S.selected].forEach(id => { if (!h.includes(id)) S.selected.delete(id); });
  if (S.mode === 'online' && S.meta && S.meta.status !== 'lobby') showScreen('game');
  renderGame();
  if (prevTurn !== g.turnId && g.phase === 'play' && g.turn === mySeat() && prevTurn !== undefined) toast(g.table ? '내 차례예요' : '내 차례 · 새로 시작해요', false, 1800);
  const rkey = g.result && `${g.gameId}-${g.result.round}-${g.phase}`;
  if ((g.phase === 'roundEnd' || g.phase === 'over') && g.result && S.lastResultShown !== rkey) {
    S.lastResultShown = rkey;
    showResult(g);
  }
  if (g.phase === 'play' && (S.modalKind === 'round' || S.modalKind === 'over')) closeModal();
}

function seatLabel(i){
  const g = S.game, s = g.seats[i];
  return i === mySeat() ? '나' : s.name;
}
function renderGame(){
  const g = S.game; if (!g) return;
  const me = mySeat(), n = g.seats.length;
  const myTurn = g.phase === 'play' && g.turn === me;
  $('roundTag').textContent = `${g.round}/${g.totalRounds}판`;
  // 상대: 내 다음 자리부터 차례대로
  let opps = '';
  for (let k = 1; k < n; k++) {
    const i = (me + k + n) % n, s = g.seats[i];
    const passed = g.phase === 'play' && g.table && g.passes.includes(i);
    const tag = s.away ? '<span class="tag away">📶✕ 컴퓨터가 대신</span>' : passed ? '<span class="tag pass">패스</span>' : '';
    const host = S.mode === 'online' && S.meta && s.id === S.meta.host ? '👑' : s.cpu ? '🤖' : '';
    const many = n - 1 >= 4 || (window.innerWidth < 1100 && n - 1 >= 3);
    const shown = many && s.cpu ? s.name.replace('컴퓨터', '컴') : s.name;   // 자리가 좁으면 '컴1'처럼 줄여 씀
    opps += `<div class="opp ${g.phase === 'play' && g.turn === i ? 'turn' : ''}">${tag}<span class="nm">${host}${esc(shown)}</span><span class="cnt"><i class="back"></i>${s.count}</span><span class="chips">💰${s.chips}</span></div>`;
  }
  $('opps').innerHTML = opps;
  $('opps').classList.toggle('many', n - 1 >= 4 || window.innerWidth < 1100 && n - 1 >= 3);
  // 가운데 판
  if (g.table) {
    $('tHead').innerHTML = `${esc(seatLabel(g.table.by))}${g.table.by === me ? '가' : '이(가)'} 냈어요 · <b>${esc(g.table.ev.name)}</b>`;
    const key = g.table.turnId + ':' + g.table.tiles.join(',');
    if ($('tTiles').dataset.key !== key) { $('tTiles').innerHTML = g.table.tiles.map(id => tileHTML(id)).join(''); $('tTiles').dataset.key = key; }
  } else {
    $('tHead').innerHTML = g.phase === 'play' ? `<b>${esc(seatLabel(g.turn))}</b> 차례 · 새로 시작` : esc(g.log || '');
    $('tTiles').innerHTML = `<div class="t-empty">${g.phase === 'play' ? '아무 조합이나 낼 수 있어요' : ''}</div>`; $('tTiles').dataset.key = '';
  }
  $('tPasses').textContent = g.phase === 'play' && g.passes.length ? g.passes.map(i => seatLabel(i)).join(' · ') + ' 패스' : (g.log && g.log.startsWith('⏰') ? g.log : '');
  renderTimer();
  // 내 패
  renderRack();
  renderPreview();
  const mine = g.seats[me];
  $('meInfo').innerHTML = mine ? `${S.hand.length}장 · 💰${mine.chips}` : '';
  const ev = evaluate([...S.selected]);
  $('playBtn').disabled = !(myTurn && ev && beats(ev, g.table && g.table.ev));
  $('passBtn').disabled = !(myTurn && g.table);
}
function renderPreview(){
  const g = S.game; if (!g) return;
  const el = $('preview');
  if (S.flash && Date.now() < S.flash.until) { el.className = 'pv flash ' + (S.flash.err ? 'bad' : 'info'); el.textContent = S.flash.msg; return; }
  const pv = previewText([...S.selected], g.table, g.phase === 'play' && g.turn === mySeat());
  el.className = 'pv ' + pv.cls; el.textContent = g.phase === 'play' ? pv.text : '판 정산 중…';
}
function renderTimer(){
  const g = S.game; if (!g) return;
  const pill = $('turnPill');
  if (g.phase !== 'play') { pill.className = 'turn-pill'; pill.textContent = g.phase === 'over' ? '게임 끝' : '다음 판 준비 중'; return; }
  const me = mySeat(), s = g.seats[g.turn];
  const now = S.mode === 'online' ? net.now() : Date.now();
  const left = Math.max(0, Math.ceil((g.turnEnds - now) / 1000));
  const auto = s.cpu || s.away;
  pill.className = 'turn-pill' + (g.turn === me ? ' me' : '') + (g.turn === me && left <= 10 ? ' hurry' : '');
  pill.innerHTML = auto ? `${esc(s.name)} 생각 중…` : `⏱ ${g.turn === me ? '내 차례' : esc(s.name) + ' 차례'} <span class="sec">${left}</span>`;
}
setInterval(() => { if (!$('game').classList.contains('hidden')) renderTimer(); }, 250);

function renderRack(){
  const rack = $('rack');
  rack.innerHTML = '<i class="ins-mark" id="insMark"></i><div class="rack-in" id="rackIn">' + S.order.map(id => tileHTML(id, S.selected.has(id) ? 'sel' : '')).join('') + '</div>';
  fitRack();
}
// 타일 수에 맞춰 크기 조절: 한 줄에 다 들어가면 한 줄, 아니면 두 줄로 고르게(20장 → 10·10)
function fitRack(){
  const rack = $('rack'), inner = $('rackIn'); if (!inner) return;
  const n = S.order.length, gap = 6;
  // 기본 크기 = CSS의 --tw 와 같은 계산 (화면 너비·높이에 비례, 34~60px)
  const portrait = innerHeight > innerWidth;
  let base = portrait ? Math.max(34, Math.min(innerWidth * 0.09, 60))            // 세로 화면: 높이가 넉넉하니 크게
                      : Math.max(34, Math.min(innerWidth * 0.046, innerHeight * 0.076, 60));
  if (!portrait && n * base + (n - 1) * gap > rack.clientWidth - 24) base = Math.min(base, Math.max(32, innerHeight * 0.064));   // 가로 화면 두 줄이면 판이 좁아지지 않게 조금 작게
  const W = rack.clientWidth - 24;
  if (!n || W <= 0) { inner.style.width = ''; return; }
  const oneRowTw = (W - gap * (n - 1)) / n;
  const perRow = oneRowTw >= base * 0.85 ? n : Math.ceil(n / 2);   // 조금만 줄이면 한 줄에 들어가면 한 줄 (판을 넓게)
  const tw = Math.max(30, Math.min(base, (W - gap * (perRow - 1)) / perRow));
  rack.style.setProperty('--tw', tw.toFixed(1) + 'px');
  inner.style.width = Math.ceil(perRow * tw + (perRow - 1) * gap + 1) + 'px';
}
window.addEventListener('resize', () => { if (!$('game').classList.contains('hidden')) fitRack(); });

/* ---------- 내기 / 패스 ---------- */
function sendAction(kind, tiles){
  const g = S.game, me = mySeat();
  if (S.mode === 'practice' || S.isHost) {
    const r = S.engine.act(me, kind, tiles);
    if (!r.ok) return toast(r.reason, true);
  } else {
    net.push(`rooms/${S.code}/actions`, { uid: net.uid, kind, tiles: tiles || null, turnId: g.turnId, t: net.now() }).catch(() => toast('보내지 못했어요. 인터넷을 확인해 주세요', true));
  }
  S.selected.clear();
  renderGame();
}
$('playBtn').onclick = () => { if (!$('playBtn').disabled) sendAction('play', [...S.selected]); };
$('passBtn').onclick = () => { if (!$('passBtn').disabled) sendAction('pass'); };
$('sortNumBtn').onclick = () => { S.sortMode = 'num'; S.order = S.order.slice().sort(byStrength); renderRack(); };
$('sortSuitBtn').onclick = () => { S.sortMode = 'suit'; S.order = S.order.slice().sort(bySuit); renderRack(); };

/* ---------- 타일 고르기(탭) · 순서 옮기기(끌기) ---------- */
let drag = null;
$('rack').addEventListener('pointerdown', e => {
  const t = e.target.closest('.tile[data-id]'); if (!t) return;
  drag = { id: Number(t.dataset.id), x: e.clientX, y: e.clientY, started: false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 10) return;
    drag.started = true;
    const g = document.createElement('div'); g.className = 'drag-ghost'; g.innerHTML = tileHTML(drag.id);
    document.body.appendChild(g); drag.ghost = g;
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  drag.px = e.clientX; drag.py = e.clientY;
  showInsert();
  e.preventDefault();
}, { passive: false });
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.started) {
    d.ghost.remove();
    const slot = rackSlotAt(e.clientX, e.clientY);
    if (slot && slot.anchor !== d.id) {
      const o = S.order.filter(id => id !== d.id);
      o.splice(o.indexOf(slot.anchor) + (slot.after ? 1 : 0), 0, d.id);
      S.order = o;
    }
    renderRack();
  } else {
    S.selected.has(d.id) ? S.selected.delete(d.id) : S.selected.add(d.id);
    renderGame();
  }
});
document.addEventListener('pointercancel', () => { if (drag && drag.ghost) drag.ghost.remove(); drag = null; const m = $('insMark'); if (m) m.style.display = 'none'; });
function rackSlotAt(x, y){
  const rr = $('rack').getBoundingClientRect();
  if (x < rr.left - 20 || x > rr.right + 20 || y < rr.top - 30 || y > rr.bottom + 20) return null;
  let best = null, bestD = Infinity;
  $('rack').querySelectorAll('.tile[data-id]').forEach(t => {
    const r = t.getBoundingClientRect();
    const dy = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
    const d = dy * 4 + Math.abs(x - (r.left + r.width / 2));
    if (d < bestD) { bestD = d; best = { t, r }; }
  });
  return best && { anchor: Number(best.t.dataset.id), after: x > best.r.left + best.r.width / 2, rect: best.r };
}
function showInsert(){
  const m = $('insMark'); if (!m) return;
  const s = drag && drag.started && rackSlotAt(drag.px, drag.py);
  if (!s) { m.style.display = 'none'; return; }
  const rr = $('rack').getBoundingClientRect();
  m.style.display = 'block';
  m.style.left = ((s.after ? s.rect.right + 3 : s.rect.left - 3) - rr.left - 2.5) + 'px';
  m.style.top = (s.rect.top - rr.top - 3) + 'px';
  m.style.height = (s.rect.height + 6) + 'px';
}

/* ---------- 결과 팝업 ---------- */
function showResult(g){
  const R = g.result, me = mySeat();
  const rows = g.seats.map((s, i) => {
    const r = R.rows[i];
    const d = r.delta > 0 ? `<span class="plus">+${r.delta}</span>` : r.delta < 0 ? `<span class="minus">${r.delta}</span>` : '0';
    return `<tr class="${i === me ? 'me' : ''}"><td>${i === R.winner ? '🏆 ' : ''}${esc(seatLabel(i))}</td>
      <td><div class="left-tiles">${r.tiles.map(id => tileHTML(id, 'mini')).join('') || '—'}</div></td>
      <td>${r.count}장${r.twos ? ` · 2가 ${r.twos}장 ×${r.mult}` : ''}</td><td>${d}</td><td>${r.chips}</td></tr>`;
  }).join('');
  const table = `<table class="res"><tr><th>이름</th><th>남은 타일</th><th>장수</th><th>칩 변화</th><th>칩</th></tr>${rows}</table>`;
  if (g.phase === 'roundEnd') {
    S.modalKind = 'round';
    showModal(`<h2>${g.round}판 정산</h2><p class="sub">${esc(seatLabel(R.winner))}${R.winner === me ? '가' : '이(가)'} 먼저 다 냈어요</p>${table}
      <p class="count-note">타일이 많은 사람이 적은 사람에게 차이만큼 칩을 줘요 · 남은 2 한 장마다 한 배씩 더<br><span id="nextCount"></span></p>`, null, 'wide');
    const tick = setInterval(() => {
      const el = $('nextCount'); if (!el || S.modalKind !== 'round') return clearInterval(tick);
      const now = S.mode === 'online' ? net.now() : Date.now();
      el.textContent = `다음 판까지 ${Math.max(0, Math.ceil((g.nextAt - now) / 1000))}초`;
    }, 250);
    return;
  }
  // 최종
  S.modalKind = 'over';
  const rank = g.seats.map((s, i) => ({ i, chips: s.chips })).sort((a, b) => b.chips - a.chips);
  const medal = ['🥇', '🥈', '🥉', '4', '5'];
  const rk = rank.map((r, k) => `<tr class="${r.i === me ? 'me' : ''}"><td class="rank1">${medal[k]}</td><td>${esc(seatLabel(r.i))}</td><td style="font-family:var(--font-num);font-weight:700">💰${r.chips}</td></tr>`).join('');
  const canRe = S.mode === 'practice' || S.isHost;
  showModal(`<h2>최종 순위</h2><table class="res">${rk}</table>
    <h3>${g.round}판 정산</h3>${table}
    ${canRe ? '' : '<p class="sub">방장이 다시 시작하면 바로 이어져요</p>'}
    <div class="modal-actions"><button class="btn" id="mHome">처음으로</button>${canRe ? '<button class="btn red" id="mAgain">같은 사람들과 다시</button>' : ''}</div>`, m => {
      m.querySelector('#mHome').onclick = () => S.mode === 'online' ? leaveRoom() : (cleanup(), renderEntry());
      const a = m.querySelector('#mAgain');
      if (a) a.onclick = () => { closeModal(); S.lastResultShown = null; S.order = [];
        if (S.mode === 'practice') { const set = { rounds: g.totalRounds, seats: g.seats.length, level: g.level }; startPractice(g.seats[me].name, set); }
        else rematch(); };
    }, 'wide');
}
function rematch(){
  const G = S.engine.game;
  const seats = G.seats.map(s => ({ id: s.id, name: s.name, cpu: s.cpu }));   // 같은 자리 그대로 (나간 사람 자리는 계속 컴퓨터가 대신)
  net.update({ [`rooms/${S.code}/actions`]: null });
  S.engine.newGame(seats, { rounds: G.totalRounds, level: G.level });
}

      <span class="cn">다섯 장</span><span>아래 족보 (4장은 낼 수 없어요)</span>
    </div>
    <p>앞사람과 <b>같은 장수</b>로 더 높게 내거나 패스해요. 패스해도 다시 차례가 오면 낼 수 있어요. 모두 패스하면 마지막에 낸 사람이 새로 시작(장수 자유).</p>
    <h3>다섯 장 족보 (약 → 강)</h3>
    <div class="combo-list">
      <span class="cn">스트레이트</span><span>이어지는 숫자 다섯 장 · 맨 위 숫자로 비교</span>
      <span class="cn">플러시</span><span>같은 문양 다섯 장 · 가장 큰 숫자로 비교</span>
      <span class="cn">풀하우스</span><span>트리플 + 페어 · 트리플 숫자로 비교</span>
      <span class="cn">포카드</span><span>같은 숫자 네 장 + 아무 한 장 · 네 장 숫자로 비교</span>
      <span class="cn">스트레이트 플러시</span><span>같은 문양 스트레이트 · 맨 위 숫자로 비교</span>
    </div>
    <p>종류가 다르면 종류가 먼저예요. 가장 약한 플러시도 가장 강한 스트레이트를 이겨요. 맨 위(가장 큰) 숫자가 같으면 그 타일의 문양으로 가려요.</p>
    <h3>스트레이트 순서</h3>
    <table class="st-table">
      <tr><td>1·2·3·4·5</td><td>5 스트레이트 (가장 약함)</td></tr>
      <tr><td>2·3·4·5·6</td><td>6 스트레이트</td></tr>
      <tr><td>…</td><td>…</td></tr>
      <tr><td>11·12·13·14·15</td><td>15 스트레이트</td></tr>
      <tr><td>12·13·14·15·1</td><td>1 스트레이트</td></tr>
      <tr><td>13·14·15·1·2</td><td>2 스트레이트 (가장 강함)</td></tr>
    </table>
    <p>2 뒤로는 이어지지 않아요(14·15·1·2·3 ✕).</p>
    <h3>정산</h3>
    <p>누가 다 내면 판 끝. 타일이 많은 사람이 적은 사람에게 장수 차이만큼 칩을 줘요. 손에 남은 2 한 장마다 한 배씩 더(1장 ×2, 2장 ×3). 첫 판은 구름 3을 가진 사람이 시작해요.</p>
    <div class="modal-actions"><button class="btn red" id="mOk">닫기</button></div>`, m => m.querySelector('#mOk').onclick = closeModal, 'wide');
}
$('rulesBtnEntry').onclick = showRules;
$('rulesBtnGame').onclick = showRules;

/* ---------- 거절 알림(심판이 받아주지 않은 행동) ---------- */
let lastReject = 0;
setInterval(() => {
  const p = S.mode === 'online' && S.players && net && S.players[net.uid];
  if (p && p.reject && p.reject.t > lastReject) { lastReject = p.reject.t; toast(p.reject.reason, true); }
}, 500);

/* ---------- 시작 ---------- */
renderEntry();
// 새로고침했으면 같은 방으로 자동으로 돌아가기
(async () => {
  const r = sess.get('lexio_room');
  if (r && (firebaseReady() || window.__LEXIO_NET__)) { $('nameInput').value = r.name; const ok = await joinRoom(r.code, r.name, true); if (!ok) sess.set('lexio_room', null); }
})();
// 글꼴을 못 받았으면 기본 글꼴을 굵게
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  Promise.all([document.fonts.load('20px "Gowun Dodum"', '가'), document.fonts.load('700 20px "Gowun Batang"', '1가')])
    .then(r => { if (!r[0].length || !r[1].length) document.documentElement.classList.add('nofont'); })
    .catch(() => document.documentElement.classList.add('nofont'));
});
</script>
